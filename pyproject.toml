[tool.ruff]
target-version = "py310"
line-length = 100
include = ["integrations.py", "seed_audio.py", "performance.py", "poetry.py", "server.py", "settings_store.py", "robot_poet/**/*.py", "patches/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]
